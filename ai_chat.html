<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@400;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e0f;
    --surface: #17181a;
    --surface2: #1f2023;
    --border: #2e2f33;
    --text: #e8e8e6;
    --muted: #6b6c72;
    --accent-code: #a8ff78;
    --accent-chat: #78c5ff;
    --user-bg: #1e2a1e;
    --user-border: #3a5c3a;
    --ai-bg: #1a1e2a;
    --ai-border: #2e3a5c;
  }

  body {
    font-family: 'IBM Plex Mono', monospace;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #topbar {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }

  #topbar .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: 15px;
    color: var(--text);
    letter-spacing: 0.05em;
  }

  .toggle {
    display: flex;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    margin-left: auto;
  }

  .toggle-btn {
    padding: 7px 20px;
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    letter-spacing: 0.08em;
    cursor: pointer;
    border: none;
    background: transparent;
    color: var(--muted);
    transition: all 0.2s;
    text-transform: uppercase;
  }

  .toggle-btn:hover { color: var(--text); }

  .toggle-btn.active.code {
    background: #1a2a0e;
    color: var(--accent-code);
    border-right: 1px solid var(--border);
  }

  .toggle-btn.active.chat {
    background: #0e1a2a;
    color: var(--accent-chat);
  }

  #model-label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .msg-wrap { display: flex; flex-direction: column; gap: 4px; }
  .msg-wrap.user { align-items: flex-end; }
  .msg-wrap.ai { align-items: flex-start; }

  .msg-label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0 4px;
  }

  .msg {
    max-width: 78%;
    padding: 11px 16px;
    font-size: 13px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
    border-radius: 8px;
  }

  .msg.user {
    background: var(--user-bg);
    border: 1px solid var(--user-border);
    color: #c8e6c8;
    border-bottom-right-radius: 2px;
  }

  .msg.ai {
    background: var(--ai-bg);
    border: 1px solid var(--ai-border);
    color: #c8d8f0;
    border-bottom-left-radius: 2px;
  }

  .msg.thinking {
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--muted);
    font-style: italic;
    font-size: 12px;
    animation: pulse 1.5s ease-in-out infinite;
  }

  @keyframes pulse { 0%,100%{opacity:0.5} 50%{opacity:1} }

  #inputrow {
    display: flex;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  #userinput {
    flex: 1;
    resize: none;
    min-height: 40px;
    max-height: 120px;
    padding: 10px 14px;
    font-size: 13px;
    font-family: 'IBM Plex Mono', monospace;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
    overflow-y: auto;
  }

  #userinput:focus { border-color: #4a4b52; }
  #userinput::placeholder { color: var(--muted); }

  #sendbtn {
    padding: 10px 22px;
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    transition: all 0.2s;
    white-space: nowrap;
  }

  #sendbtn:hover { border-color: #4a4b52; background: #27282c; }
  #sendbtn:active { transform: scale(0.97); }
  #sendbtn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

  #clearbtn {
    padding: 10px 14px;
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
    cursor: pointer;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    transition: all 0.2s;
  }
  #clearbtn:hover { color: var(--text); border-color: #4a4b52; }
</style>
</head>
<body>

<div id="topbar">
  <div class="logo">// AI CHAT  -  MADE BY PROGRAMZELVA</div>
  <div id="model-label"></div>
  <div class="toggle">
    <button class="toggle-btn code" id="btn-code" onclick="setMode('code')">⬡ Coding</button>
    <button class="toggle-btn chat active" id="btn-chat" onclick="setMode('chat')">◈ Chating</button>
  </div>
</div>

<div id="messages">
  <div class="msg-wrap ai">
    <div class="msg-label">ai</div>
    <div class="msg ai">Ahoj! Jsem AI. Zvol mód nahoře a piš.</div>
  </div>
</div>

<div id="inputrow">
  <button id="clearbtn" onclick="clearChat()" title="Vymazat historii">↺</button>
  <textarea id="userinput" placeholder="Napiš zprávu... (Enter = odeslat, Shift+Enter = nový řádek)" rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
  <button id="sendbtn" onclick="sendMessage()">Odeslat →</button>
</div>

<script>
const KEYS = {
  code: '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',
  chat: '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'
};
const MODELS = {
  code: 'deepseek/deepseek-v4-flash:free',
  chat: 'openrouter/free',
};
const LABELS = {
  code: 'deepseek-v4-flash',
  chat: 'models-router'
};
const IDENTITY = ['what ai you are', 'what language model are you', 'kdo jsi', 'kdo jste', 'jaky model', 'jaký model', 'jaká ai', 'jaka ai', 'jaký jsi', 'jaky jsi', 'jsi ai', 'jsi claude', 'jsi gpt', 'jsi chatgpt', 'jsi gemini', 'jaký jazykový', 'jaky jazykovy', 'co jsi za', 'what are you', 'who are you', 'which model', 'what model', 'jaky jsi model', 'jaký jsi model'];

let mode = 'chat';
let history = [];

function setMode(m) {
  mode = m;
  document.getElementById('btn-code').classList.toggle('active', m==='code');
  document.getElementById('btn-chat').classList.toggle('active', m==='chat');
  document.getElementById('model-label').textContent = '→ ' + LABELS[m];
}
setMode('chat');

function isIdentity(text) {
  const t = text.toLowerCase();
  return IDENTITY.some(tr => t.includes(tr));
}

function addMsg(role, text) {
  const d = document.getElementById('messages');
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap ' + (role==='user'?'user':'ai');
  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = role==='user' ? 'YOU' : 'ai';
  const el = document.createElement('div');
  el.className = 'msg ' + (role==='user'?'user':'ai');
  el.textContent = text;
  wrap.appendChild(label);
  wrap.appendChild(el);
  d.appendChild(wrap);
  d.scrollTop = d.scrollHeight;
  return el;
}

function addThinking() {
  const d = document.getElementById('messages');
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap ai';
  const el = document.createElement('div');
  el.className = 'msg thinking';
  el.textContent = '▸ přemýšlím...';
  wrap.appendChild(el);
  d.appendChild(wrap);
  d.scrollTop = d.scrollHeight;
  return wrap;
}

function clearChat() {
  history = [];
  const d = document.getElementById('messages');
  d.innerHTML = '';
  addMsg('ai', 'Historie vymazána. Začni znovu!');
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleKey(e) {
  if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

async function sendMessage() {
  const inp = document.getElementById('userinput');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  inp.style.height = 'auto';
  document.getElementById('sendbtn').disabled = true;

  addMsg('user', text);
  history.push({role:'user', content: text});

  if (isIdentity(text)) {
    const reply = 'Jsem ai pohánená openrouterem, navržená na to aby odpovídala a pomáhalo s programováním. MADE BY PROGRAMZELVA.';
    addMsg('ai', reply);
    history.push({role:'assistant', content: reply});
    document.getElementById('sendbtn').disabled = false;
    return;
  }

  const thinking = addThinking();

  try {
    const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + KEYS[mode],
        'HTTP-Referer': 'https://localhost',
        'X-Title': 'AI Chat'
      },
      body: JSON.stringify({
        model: MODELS[mode],
        messages: history,
        max_tokens: 1000
      })
    });
    const data = await res.json();
    thinking.remove();
    if (data.error) {
      const errMsg = 'Chyba API: ' + (data.error.message || JSON.stringify(data.error));
      addMsg('ai', errMsg);
    } else {
      const reply = data.choices?.[0]?.message?.content || 'ERROR: No response';
      addMsg('ai', reply);
      history.push({role:'assistant', content: reply});
    }
  } catch(e) {
    thinking.remove();
    addMsg('ai', 'ERROR: 404 ' + e.message);
  }

  document.getElementById('sendbtn').disabled = false;
  document.getElementById('userinput').focus();
}
</script>
</body>
</html>
